[project]
name = "riddim"
version = "0.1.0"
description = "Theory-grounded dub and dubstep composition for the Synthstrom Deluge"
requires-python = ">=3.9"
dependencies = ["mido>=1.3", "python-rtmidi>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Audio previews (`render`, `corpus --audio`, `vary --audio`).
audio = ["numpy>=1.21", "scipy>=1.7"]

[project.scripts]
riddim = "riddim.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["riddim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
