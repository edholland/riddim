[project]
name = "riddim"
version = "0.1.0"
description = "Theory-grounded dub and dubstep composition for the Synthstrom Deluge"
requires-python = ">=3.9"
dependencies = ["mido>=1.3", "python-rtmidi>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Audio previews (`render`, `corpus --audio`, `vary --audio`).
audio = ["numpy>=1.21", "scipy>=1.7"]

[project.scripts]
riddim = "riddim.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["riddim*"]

[tool.setuptools.package-data]
# The audio preview's samples and impulse responses (see their LICENSES.md).
"riddim.render" = ["samples/*.md", "samples/*/*.wav"]
# Rhythm cells mined from the references (ml/mine_cells.py): grid positions only.
"riddim.theory" = ["cells.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
